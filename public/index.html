<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
    />
    <title>Scramjet Site</title>
    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <link rel="stylesheet" href="index.css" />
    <script src="register-sw.js" defer></script>
    <script src="search.js" defer></script>
    <script src="particles.js" defer></script>
    <script src="clock.js" defer></script>
    <script src="index.js" defer></script>
  </head>
  <body>
    <div id="particles"></div>

    <main class="landing" id="landing">
      <div class="datetime">
        <div class="date" id="sj-date"></div>
        <div class="clock" id="sj-clock">--:--:-- --</div>
        <div class="greeting" id="sj-greeting"></div>
      </div>

      <form id="sj-form" class="searchbar">
        <input
          id="sj-search-engine"
          value="https://www.google.com/search?q=%s"
          type="hidden"
        />
        <input
          id="sj-address"
          type="text"
          placeholder="Search web or enter URL..."
          autocomplete="off"
        />
        <button type="submit" class="search-btn" aria-label="Search">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>

      <button type="button" id="sj-show-apps" class="show-apps">
        Show Apps
      </button>

      <div id="sj-apps-panel" class="apps-panel hidden">
        <button class="app-shortcut" data-url="https://www.google.com">Google</button>
        <button class="app-shortcut" data-url="https://www.youtube.com">YouTube</button>
        <button class="app-shortcut" data-url="https://en.wikipedia.org">Wikipedia</button>
        <button class="app-shortcut" data-url="https://www.reddit.com">Reddit</button>
      </div>

      <div class="desc">
        <p id="sj-error"></p>
        <pre id="sj-error-code"></pre>
      </div>
    </main>

    <div id="sj-browser-bar" class="browser-bar hidden">
      <button type="button" id="sj-home" class="bar-btn" title="Home" aria-label="Home">&#8962;</button>
      <button type="button" id="sj-back" class="bar-btn" title="Back" aria-label="Back">&#8592;</button>
      <button type="button" id="sj-forward" class="bar-btn" title="Forward" aria-label="Forward">&#8594;</button>
      <button type="button" id="sj-reload" class="bar-btn" title="Reload" aria-label="Reload">&#8635;</button>
      <form id="sj-frame-form" class="bar-address-form" autocomplete="off">
        <input id="sj-frame-url" type="text" class="bar-address" spellcheck="false" />
      </form>
    </div>
  </body>
</html>
